<style>

rgin:0 0 25px}.tight{margin-bottom:6px}.form-field{margin:15px 0 5px}.form-field label{display:block;font-size:13px;font-weight:700;margin-bottom:10px}.field-wrap{border:1.5px solid var(--line);background:#fff;border-radius:13px;display:flex;align-items:center;padding:0 13px;gap:12px;height:55px}.field-wrap svg{width:19px;height:19px;stroke:var(--brown);fill:none;stroke-width:1.7}.field-wrap input{border:0;outline:0;min-width:0;width:100%;height:100%;background:transparent;font-size:15px}.field-wrap input::placeholder{color:#9b897a}.btn{display:flex;align-items:center;justify-content:center;gap:14px;background:var(--brown);color:#fff;border:0;border-radius:17px;min-height:61px;width:100%;font-size:17px;margin-top:23px;box-shadow:0 8px 20px #58301e12}.btn:disabled{background:#d9cabe;color:#978b82}.ghost{border:0;background:none;color:var(--brown);font-size:16px;text-align:center;padding:16px 4px}.bottom{margin-top:auto;padding-top:12px}.err{margin:12px 0 0;font-size:13px;color:#ad2547;line-height:1.45}.notice{font-size:12px;color:#88776b;text-align:center;margin:15px 0}.cookies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;margin-top:19px}.cookie-card{min-width:0;background:#fff;border:1.5px solid var(--line);border-radius:18px;min-height:155px;padding:13px 5px 12px;text-align:center;position:relative;color:#111}.cookie-card.selected{border:2px solid var(--green)}.cookie-card:disabled{opacity:.78}.cookie-card .check{position:absolute;right:8px;top:8px;background:var(--green);color:white;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:14px}.cookie-card b{display:block;font-size:12px;margin-top:10px;min-height:27px}.cookie-card span.price{font-size:12px;color:var(--gray)}.cookie-card b.sold{color:var(--pink)}.cookie-art{height:70px;width:70px;border-radius:50%;position:relative;display:inline-block;background:var(--dough);flex-shrink:0}.chip{position:absolute;border-radius:50%;height:7px;width:7px;background:var(--chip)}.chip:nth-child(1){left:24%;top:25%}.chip:nth-child(2){left:63%;top:21%}.chip:nth-child(3){left:29%;top:68%}.chip:nth-child(4){left:51%;top:58%}.chip:nth-child(5){left:72%;top:68%}.chip:nth-child(6){left:43%;top:78%}.cookie-art.mm .chip:nth-child(1){background:#3272d6}.cookie-art.mm .chip:nth-child(2){background:#b33235}.cookie-art.mm .chip:nth-child(3){background:#bf28a4}.cookie-art.mm .chip:nth-child(4){background:#48a965}.cookie-art.mm .chip:nth-child(5){background:#f2c900}.limit{font-size:14px;font-weight:700;color:#555}.box{border:1px solid #98705c;border-radius:17px;padding:17px;margin:15px 0 2px;background:#fff}.box .eyebrow{font-size:11px;margin-bottom:13px}.user-name{font-size:17px;font-weight:800;margin:0 0 5px}.muted{color:#606060;font-size:14px}.item-line{display:flex;align-items:center;gap:14px}.item-line .cookie-art{width:68px;height:68px}.item-line h3{margin:0 0 6px;font-size:18px}.item-line p{margin:0;color:var(--brown);font-weight:700}.rule{border:0;border-top:1px solid var(--line);margin:16px 0}.quantity-row,.sum-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}.qty{display:flex;align-items:center;gap:12px}.qty button{width:35px;height:37px;border:0;border-radius:10px;background:#f9f5ef;color:var(--brown);font-size:23px}.qty button.plus{background:var(--brown);color:#fff}.qty b{min-width:16px;text-align:center}.sum-row{margin:11px 0}.sum-row.total{font-size:20px;font-weight:800}.order-stack{display:flex;flex-direction:column;gap:10px}.order-item .cookie-art{width:48px;height:48px}.order-item .item-line h3{font-size:14px}.order-item .item-line p{font-size:12px}.order-item .qty button{width:32px;height:31px}.order-item .quantity-row{margin-top:12px}.progress-card{margin-top:8px}.progress-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}.progress-top .cookie-art{width:42px;height:42px}.progress-value{color:var(--green);font-size:27px;font-weight:800}.track{height:11px;border-radius:14px;background:#ded1c6;overflow:hidden;margin-top:8px}.track div{height:100%;border-radius:14px;background:var(--green);transition:width .25s}.timeline{margin-top:20px}.event{display:flex;gap:13px;min-height:88px}.event-marker{width:34px;flex-shrink:0;display:flex;align-items:center;flex-direction:column}.event-bubble{width:32px;height:32px;border-radius:50%;border:1.5px solid #333;display:grid;place-items:center;background:#fff;color:var(--brown);font-size:15px}.event.done .event-bubble{border:0;background:var(--pale);color:var(--green)}.event-marker:after{content:'';display:block;width:1px;flex:1;background:var(--line)}.event:last-child .event-marker:after{display:none}.event h3{font-size:16px;margin:3px 0 6px;color:#141414}.event.done h3{color:var(--green)}.event.current h3{color:var(--brown)}.event p{margin:0;color:#7b6d61;font-size:13px;line-height:1.4}.success{text-align:center;padding-top:15px}.success-icon{display:grid;place-items:center;margin:0 auto 30px;border-radius:50%;width:90px;height:90px;background:var(--pale);color:white}.success-icon span{display:grid;place-items:center;border-radius:50%;background:var(--green);width:62px;height:62px;font-size:35px}.success h1{font-size:36px}.success .intro{margin:14px 0}.success .box{text-align:left;margin:25px 0}.summary-item{font-size:13px;color:#555}.hide{display:none!important}@media(max-width:340px){.shell{padding:20px 15px}.brand{font-size:15px}.online{font-size:10px;padding:7px}.cookies{gap:8px}.cookie-card{min-height:143px}.cookie-art{width:61px;height:61px}}

/* Contraste, foco e alvos de toque para uso no celular e na máquina. */
.app{max-width:520px;padding:16px;background:var(--bg)}
.shell{padding:24px clamp(14px,4vw,26px);box-shadow:0 12px 45px #6339240a}
.head{flex-wrap:wrap;row-gap:12px}.brand{font-size:16px}
.online.warn{background:#fff1d6;color:#805015}.online{min-height:32px}
.ghost{min-height:48px;width:100%}.btn{font-weight:700}
button:focus-visible,a:focus-visible{outline:3px solid var(--pink);outline-offset:4px}
.field-wrap:focus-within{border-color:var(--pink);box-shadow:0 0 0 3px #ac064a12}
.cookie-card{padding:17px 8px;min-height:176px;transition:border-color .15s,box-shadow .15s}
.cookie-card.selected{box-shadow:0 0 0 3px #4a9a4915}
.cookie-card b{font-size:14px;line-height:1.3}.cookie-card:disabled{opacity:.65}
.selection-summary{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:15px 0 0;padding:12px 14px;background:#f3ece3;border-radius:12px;font-size:13px;color:var(--brown)}
.maintenance-view{padding:28px 0;text-align:center}.maintenance-view h1{font-size:32px;letter-spacing:-.8px}
.maintenance-icon{display:grid;place-items:center;width:80px;height:80px;border-radius:24px;margin:8px auto 24px;background:#fff0d2;color:#895315}
.maintenance-icon svg{width:38px;height:38px;fill:none;stroke:currentColor;stroke-width:1.8}
.maintenance-view .eyebrow{color:#805015;margin-bottom:14px}.maintenance-view .intro{max-width:350px;margin:16px auto 22px}
.maintenance-help{padding:18px;text-align:left;background:#fff6e8;border:1px solid #e5c89b;border-radius:16px;font-size:14px;line-height:1.6;color:#6a4c2c}
.maintenance-help strong{display:block;margin-bottom:6px}.maintenance-view .btn{margin-top:26px}
.selection-summary [aria-live]{font-weight:700}.page{padding-top:25px}
@media(max-width:360px){.app{padding:8px}.shell{padding:20px 13px;border-radius:22px}.brand{font-size:15px}.head{gap:7px}.online{font-size:10px;padding:6px 8px}.cookie-card b{font-size:12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<body><main class="app"><section class="shell"><header class="head"><div class="logo">Docce<small>Luna</small></div><div class="brand">Docce Luna</div><div id="online" class="online off"><span class="dot"></span><span id="online-label">Conectando...</span></div></header><div id="page" class="page"></div></section></main>
<script>
'use strict';
/* As paginas podem ser servidas pelo PC ou pelo ESP32.
   A API continua no ESP32, independentemente do endereco usado para abrir o HTML.
   O firmware permite CORS e o cabecalho Authorization.
*/
const IHM_VERSAO="4.0 - ESP32 e servidor Python";
const API_BASE='http://192.168.4.1';
const API={status:'/api/status',register:'/api/auth/register',login:'/api/auth/login',me:'/api/auth/me',inventory:'/api/estoque',createOrder:'/api/pedido',orderStatus:'/api/pedido/status'};
const PRODUCTS=[
 {id:0,name:'Chocolate',dough:'#633923',chip:'#29190d'},
 {id:1,name:'Chocolate Branco',dough:'#efbd79',chip:'#fff2d4'},
 {id:2,name:'Red Velvet',dough:'#a12d29',chip:'#f9c786'},
 {id:3,name:'Baunilha',dough:'#efbd79',chip:'#ad7144'},
 {id:4,name:'M&M’s',dough:'#efbd79',chip:'#bf28a4',mm:true},
 {id:5,name:'Integral',dough:'#90613f',chip:'#35200d'}
];
const PRICE_CENTS=990; // R$ 9,90. Ajuste também o texto comercial conforme o preço definitivo.
// JSON persistente deste navegador. Não guarda senhas, hashes, tokens ou permissões.
// O endereço separa os dados de controladores configurados em endereços diferentes.
const LOCAL_DB_KEY='cookie-express:local:v1:'+API_BASE;
const STOCK_SYNC_MS=30000;
let storageWarning='';
function emptyDatabase(){return {version:1,apiBase:API_BASE,profiles:[],inventory:null};}
function validText(value,max){return typeof value==='string'&&value.length<=max;}
function validQuantities(values){return Array.isArray(values)&&values.length===6&&values.every(n=>Number.isSafeInteger(n)&&n>=0);}
function readDatabase(){
 try{
  const raw=localStorage.getItem(LOCAL_DB_KEY);
  if(!raw)return emptyDatabase();
  const data=JSON.parse(raw);
  if(data?.version!==1||data.apiBase!==API_BASE||!Array.isArray(data.profiles))throw Error('Formato inválido');
  const db=emptyDatabase();
  // Reconstrói somente os campos conhecidos, inclusive se o JSON tiver sido adulterado.
  db.profiles=data.profiles.filter(p=>p&&validText(p.name,63)&&p.name.trim().length>=2&&validText(p.registration,32)).slice(-30).map(p=>({name:p.name,registration:p.registration}));
  if(data.inventory&&validQuantities(data.inventory.quantities)&&Number.isSafeInteger(data.inventory.syncedAt)&&data.inventory.syncedAt>0)
   db.inventory={quantities:[...data.inventory.quantities],syncedAt:data.inventory.syncedAt};
  return db;
 }catch{storageWarning='Não foi possível ler os dados locais. A IHM continuará consultando o ESP32.';return emptyDatabase();}
}
const localDB=readDatabase();
function saveDatabase(){
 try{localStorage.setItem(LOCAL_DB_KEY,JSON.stringify(localDB));storageWarning='';}
 catch{storageWarning='O navegador não permitiu salvar os dados neste celular. As informações continuarão sendo consultadas na máquina.';}
}
function findLocalProfile(identity){
 const exact=localDB.profiles.find(p=>p.name===identity);
 if(exact)return exact;
 const aliases=localDB.profiles.filter(p=>p.registration&&p.registration.toLocaleLowerCase('pt-BR')===identity.toLocaleLowerCase('pt-BR'));
 if(aliases.length>1)throw Error('Essa sigla corresponde a mais de um nome neste celular. Use o nome completo.');
 return aliases[0]||null; // Uma conta ausente do celular ainda pode existir no ESP32.
}
function rememberProfile(name,registration){
 const previous=localDB.profiles.find(p=>p.name===name);
 const profile={name,registration:registration||previous?.registration||''};
 localDB.profiles=localDB.profiles.filter(p=>p.name!==name).concat(profile).slice(-30);
 saveDatabase();return profile;
}
const state={screen:'login',user:null,token:null,inventory:localDB.inventory?[...localDB.inventory.quantities]:Array(6).fill(null),inventoryVerifiedAt:null,stockError:'',cart:[],order:null,error:'',busy:false,online:false,bankReady:false,maintenance:false,limitActive:false,poll:null};
// A leitura do disco nunca libera compras; exige uma consulta nesta execução.
function stockReady(){return !state.maintenance&&state.online&&state.bankReady&&state.inventoryVerifiedAt!==null&&performance.now()-state.inventoryVerifiedAt<STOCK_SYNC_MS&&validQuantities(state.inventory);}
function localDataNotice(){
 const selecting=['select','confirm'].includes(state.screen);
 const synced=localDB.inventory?.syncedAt;
 const stock=selecting?`<p class="notice">${stockReady()?'Estoque atualizado.':synced?'Estoque salvo em '+esc(new Date(synced).toLocaleString('pt-BR'))+'. Aguardando atualização para comprar.':'Consultando a disponibilidade dos sabores…'}</p>`:'';
 return stock+(state.stockError&&selecting?`<p class="err" role="alert">${esc(state.stockError)}</p><button type="button" class="ghost" data-action="refresh-stock">Atualizar estoque</button>`:'')+(storageWarning?`<p class="err" role="status">${esc(storageWarning)}</p>`:'');
}
const root=document.getElementById('page');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=cents=>(cents/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const total=()=>state.cart.reduce((n,x)=>n+x.qty,0);
const priceTotal=()=>total()*PRICE_CENTS;
function cookie(p){return `<span class="cookie-art ${p.mm?'mm':''}" style="--dough:${p.dough};--chip:${p.chip}">${[1,2,3,4,5,...(p.mm?[]:[6])].map(()=>'<i class="chip"></i>').join('')}</span>`}
function step(n){return `<div class="step"><span class="eyebrow">ETAPA ${n} DE 4</span><span class="bars">${[1,2,3,4].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span></div>`}
function btn(label,action,disabled=false){return `<button class="btn" data-action="${action}" ${disabled?'disabled':''}>${label} <span aria-hidden="true">→</span></button>`}
function field(name,label,type='text',placeholder=label,autocomplete='off'){
 const icon=type==='password'?'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>':'<circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>';
 return `<div class="form-field"><label for="${name}">${label}</label><div class="field-wrap"><svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg><input id="${name}" name="${name}" type="${type}" placeholder="${esc(placeholder)}" autocomplete="${autocomplete}" required></div></div>`;
}
function maintenanceView(){
 const interrupted=state.screen==='progress'&&state.order;
 return `<section class="maintenance-view" role="alert" aria-labelledby="maintenance-title"><div class="maintenance-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6 4 4m-7 3-6 6a2 2 0 0 1-3-3l6-6a6 6 0 0 1 8-8l-4 4 4 4 4-4a6 6 0 0 1-8 8Z"/></svg></div><div class="eyebrow">PAUSA NO ATENDIMENTO</div><h1 id="maintenance-title">Máquina em manutenção</h1><p class="intro">As compras estão temporariamente indisponíveis. Nossa equipe precisa verificar a máquina.</p><div class="maintenance-help"><strong>${interrupted?'Confira seu pedido com o responsável':'Aguarde a liberação do responsável'}</strong>${interrupted?`Pedido #${esc(state.order.id)} · ${Number(state.order.delivered)||0} de ${Number(state.order.requested)||0} unidades confirmadas até a última atualização. Procure o responsável para conferir a entrega.`:'O atendimento será retomado após a verificação e liberação pelo responsável.'}</div>${btn('Verificar disponibilidade','check-status',state.busy)}${state.user?'<button type="button" class="ghost" data-action="logout">Sair da minha conta</button>':''}</section>`;
}
function updateConnectionBadge(){
 document.getElementById('online').className='online '+(state.maintenance?'warn':state.online&&state.bankReady?'':'off');
 document.getElementById('online-label').textContent=connectionLabel();
}
function message(){return state.error?`<p class="err" role="alert">${esc(state.error)}</p>`:''}
function render(){
 updateConnectionBadge();
 if(state.maintenance){root.innerHTML=maintenanceView();return;}
 let html='';
if(state.screen==='login'){html=`<div class="eyebrow">ACESSO À MÁQUINA</div><h1 style="margin-top:18px;color:#111">Bem-vindo!</h1><p class="intro">Entre na sua conta para comprar seu cookie.</p><form id="loginForm">${field('identity','Nome ou Sigla','text','Nome ou Sigla','username')}${field('password','Senha','password','********','current-password')}${message()}<div class="bottom">${btn(state.busy?'Entrando...':'Entrar','login',state.busy)}<button type="button" class="ghost" data-action="register-screen">Criar uma conta</button></div></form>`}
if(state.screen==='register'){html=`<div class="eyebrow">PRIMEIRO ACESSO</div><h1 style="margin-top:18px">Crie sua conta</h1><p class="intro">Cadastre-se para comprar seu cookie.</p><form id="registerForm">${field('name','Nome completo','text','Nome completo','name')}${field('registration','Sigla','text','Sua Sigla')}${field('password','Senha','password','********','new-password')}${field('confirm','Confirmar senha','password','********','new-password')}${message()}<div class="bottom">${btn(state.busy?'Cadastrando...':'Cadastrar','register',state.busy)}<button type="button" class="ghost" data-action="login-screen">Já tenho conta</button></div></form>`}
if(state.screen==='select'){html=step(1)+`<h1>Escolha seu cookie</h1><p class="intro tight">Todos os sabores por apenas ${money(PRICE_CENTS)}</p><div class="limit">Escolha até 3 cookies por pedido</div><div class="selection-summary"><span aria-live="polite">${total()} de 3 selecionados</span><strong>${money(priceTotal())}</strong></div><div class="cookies">${PRODUCTS.map(p=>{const item=state.cart.find(x=>x.id===p.id),out=state.inventory[p.id]===0,unavailable=!stockReady()||state.busy;return `<button class="cookie-card ${item?'selected':''}" data-flavor="${p.id}" ${out||unavailable?'disabled':''}>${item?'<span class="check">✓</span>':''}${cookie(p)}<b class="${out?'sold':''}">${out?'ESGOTADO':esc(p.name)}</b><span class="price">${out?'-':unavailable?'Indisponível':money(PRICE_CENTS)}</span><span class="price" style="display:block;margin-top:5px">${state.inventory[p.id]===null?'Sem consulta':state.inventory[p.id]+' em estoque'+(!stockReady()?' (salvo)':'')}</span></button>`}).join('')}</div>${message()}<div class="bottom">${btn('Continuar','to-confirm',total()===0||!stockReady()||state.busy)}<button class="ghost" data-action="logout" style="width:100%">Sair</button></div>`}
if(state.screen==='confirm'){html=step(2)+`<h1>Confirme seu pedido</h1><section class="box"><div class="eyebrow">COMPRANDO COMO</div><p class="user-name">${esc(state.user?.name)}</p><span class="muted">Sigla ${esc(state.user?.registration||'—')}</span></section><section class="box order-stack">${state.cart.map(x=>{const p=PRODUCTS[x.id];return `<div class="order-item"><div class="item-line">${cookie(p)}<div><h3>${esc(p.name)}</h3><p>${money(PRICE_CENTS)} cada</p></div></div><div class="quantity-row"><span>Quantidade</span><div class="qty"><button data-qty="${p.id}" data-delta="-1" aria-label="Reduzir ${esc(p.name)}">−</button><b>${x.qty}</b><button class="plus" data-qty="${p.id}" data-delta="1" aria-label="Aumentar ${esc(p.name)}" ${total()>=3||x.qty>=(state.inventory[x.id]??0)?'disabled':''}>+</button></div></div><div class="sum-row muted"><span>Subtotal</span><span>${money(x.qty*PRICE_CENTS)}</span></div></div>`}).join('<hr class="rule">')}<hr class="rule"><div class="sum-row total"><span>Total</span><span>${money(priceTotal())}</span></div></section>${message()}<div class="bottom">${btn(state.busy?'Enviando...':'Confirmar pedido','place-order',state.busy||!stockReady())}<button class="ghost" data-action="back-select" style="width:100%">Voltar e alterar</button></div>`}
if(state.screen==='progress'){const status=state.order?.status||'recebido',completed=state.order?.delivered||0,requested=state.order?.requested||total()||1;const pc=Math.min(99,Math.floor(completed/requested*100));const pct=status==='entregue'&&state.order?.confirmed_by_sensor===true?100:pc;const stages=[['Pedido recebido','Seu pedido foi registrado.'],['Separando cookie','Estamos separando seu cookie.'],['Liberando na bandeja','Quase pronto!']];const index=status==='recebido'?0:2;html=step(3)+`<h1>${['erro','cancelado','ocioso'].includes(status)?'Pedido interrompido':'Preparando seu pedido'}</h1><p class="intro">${['erro','cancelado','ocioso'].includes(status)?'Procure o responsável para conferir sua entrega.':'Aguarde enquanto preparamos o seu cookie.'}</p><section class="box progress-card"><div class="progress-top"><div style="display:flex;gap:9px;align-items:center">${cookie(PRODUCTS[state.cart[0]?.id??0])}<b>${state.cart.length===1?esc(PRODUCTS[state.cart[0].id].name):total()+' cookies'}</b></div><b style="color:#666">Pedido #${esc(state.order?.id||'—')}</b></div><div class="progress-top" style="margin-top:22px"><span>Progresso do pedido</span><span class="progress-value">${pct}%</span></div><div class="track"><div style="width:${pct}%"></div></div></section><div class="timeline">${stages.map(([title,sub],i)=>{const done=status==='entregue'||i<index;return `<div class="event ${done?'done':i===index?'current':''}"><div class="event-marker"><div class="event-bubble">${done?'✓':i===index?'●':'·'}</div></div><div><h3>${done&&i===2?'Liberado na bandeja':title}</h3><p>${done&&i===2?'Bom apetite!':sub}</p></div></div>`}).join('')}</div>${message()}<p class="notice bottom">${['erro','cancelado','ocioso'].includes(status)?'Confira a entrega com o responsável antes de fazer outro pedido.':status==='entregue'?'Entrega confirmada.':'Não feche esta tela enquanto o pedido é preparado.'}</p>${['erro','cancelado','ocioso'].includes(status)?btn('Voltar aos sabores','dismiss-order'):''}`}
if(state.screen==='success'){html=`<div class="success"><div class="success-icon"><span>✓</span></div><h1>Parabéns!</h1><p style="font-weight:800;color:#555;font-size:18px;margin:10px 0">Seu cookie está pronto.</p><p class="intro">Retire seu pedido na bandeja.</p><div class="box"><div class="eyebrow">SEU PEDIDO</div>${state.cart.map(x=>`<div class="item-line" style="margin:12px 0">${cookie(PRODUCTS[x.id])}<div><h3>${esc(PRODUCTS[x.id].name)}</h3><span class="summary-item">${x.qty} ${x.qty===1?'unidade':'unidades'} · ${money(PRICE_CENTS)} cada</span></div></div>`).join('')}<hr class="rule"><div class="sum-row total"><span>Total</span><span>${money(priceTotal())}</span></div></div><p class="intro" style="margin-top:22px">Obrigado por usar a Cookie Express!</p></div><div class="bottom">${btn('Fazer novo pedido','new-order')}<button class="ghost" data-action="logout" style="width:100%">↪ &nbsp; Sair</button></div>`}
root.innerHTML=html+localDataNotice();
}
let requestGeneration=0,machineStatusGeneration=0;
function applyMachineStatus(data,generation){
 if(typeof data?.manutencao!=='boolean'||generation<machineStatusGeneration)return;
 machineStatusGeneration=generation;
 const changed=state.maintenance!==data.manutencao;
 state.maintenance=data.manutencao;
 if(typeof data.fim_curso_acionado==='boolean')state.limitActive=data.fim_curso_acionado;
 if(state.maintenance){
  stopPolling();
  if(state.screen==='progress'&&state.order){state.order.status='erro';state.order.confirmed_by_sensor=false;}
 }
 if(changed)render();
}
async function request(path,{method='GET',body,token=state.token,timeout=20000}={}){
 const controller=new AbortController(),t=setTimeout(()=>controller.abort(),timeout),generation=++requestGeneration;
 try{
  const r=await fetch(API_BASE+path,{method,headers:{...(body?{'Content-Type':'application/json'}:{}),...(token?{'Authorization':'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined,signal:controller.signal,cache:'no-store'});
  const data=await r.json().catch(()=>({}));
  applyMachineStatus(data,generation);
  if(!r.ok)throw new Error(data.erro||data.error||data.message||`Erro HTTP ${r.status}`);
  return data;
 }finally{clearTimeout(t)}
}
function connectionLabel(){return state.maintenance?'Em manutenção':!state.online?'Sem conexão':state.bankReady?'Pronta para atender':'Serviço indisponível';}
let pingRunning=false;
async function ping(){
 if(pingRunning||state.busy)return;
 pingRunning=true;
 const wasOnline=state.online;
 try{const d=await request(API.status,{timeout:15000,token:null});state.online=d.online===true;state.bankReady=d.banco_online===true&&!d.venda_pendente&&!d.falha_persistencia;}
 catch{state.online=false;state.bankReady=false;state.inventoryVerifiedAt=null;}
 finally{pingRunning=false;}
 updateConnectionBadge();
 if(state.maintenance){render();return;}
 if(['select','confirm'].includes(state.screen)&&!state.busy){
  if(state.online&&!wasOnline)await loadStock();else render();
 }
}
function parseInventory(data){
 // Usa o número do slot, mesmo se o servidor enviar os itens em outra ordem.
 if(!Array.isArray(data?.itens)||data.itens.length!==6)throw Error('Formato inválido de estoque');
 const quantities=Array(6).fill(null),seen=new Set();
 for(const item of data.itens){
  if(!item||!Number.isInteger(item.slot)||item.slot<1||item.slot>6||seen.has(item.slot)||!Number.isSafeInteger(item.quantidade)||item.quantidade<0)
   throw Error('Compartimento ou quantidade inválidos no estoque');
  quantities[item.slot-1]=item.quantidade;seen.add(item.slot);
 }
 return quantities;
}
let inventoryRequest=null;
async function syncInventory(){
 if(inventoryRequest)return inventoryRequest;
 inventoryRequest=(async()=>{
  try{
   const quantities=parseInventory(await request(API.inventory));
   state.inventory=quantities;state.inventoryVerifiedAt=performance.now();state.online=true;state.stockError='';
   localDB.inventory={quantities:[...quantities],syncedAt:Date.now()};saveDatabase();
   return true;
  }catch(e){
   state.inventoryVerifiedAt=null;
   state.stockError='Não foi possível atualizar o estoque do ESP32: '+e.message+'. Os dados salvos são apenas para consulta.';
   return false;
  }
 })();
 try{return await inventoryRequest;}finally{inventoryRequest=null;}
}
async function loadStock(){const ok=await syncInventory();render();return ok;}
async function authenticate(type){
 if(state.busy)return;
 const form=document.getElementById(type==='login'?'loginForm':'registerForm');
 if(!form||!form.reportValidity())return;
 const get=id=>form.elements[id].value.trim();
 const password=form.elements.password.value;
 if(type==='register'&&(password.length<6||password!==form.elements.confirm.value)){
  state.error=password.length<6?'A senha deve ter no mínimo 6 caracteres.':'As senhas não coincidem.';
  return render();
 }
 // O JSON ajuda a localizar o nome; somente a resposta do ESP32 aprova a senha.
 const registration=type==='register'?get('registration'):'';
 const identity=type==='login'?get('identity'):get('name');
 state.busy=true;state.error='';
 try{
  if(!identity||identity.length>63||password.length>100)throw Error('Confira o nome ou sigla e o limite de 100 caracteres da senha.');
  if(registration.length>32)throw Error('A sigla deve ter até 32 caracteres.');
  const cached=type==='login'?findLocalProfile(identity):null;
  const nome=identity;
  if(type==='register'&&nome.length<2)throw Error('Informe seu nome completo.');
  const d=await request(type==='login'?API.login:API.register,{method:'POST',body:{nome,senha:password,...(type==='register'?{sigla:registration}:{})},token:null});
  const serverName=d.usuario?.nome||d.usuario?.name||d.user?.name||d.nome||d.name;
  if(typeof d.token!=='string'||!d.token||!validText(serverName,63)||serverName.length<2)throw Error('Resposta de autenticação incompleta');
  state.token=d.token;
  state.bankReady=true;
  state.user=rememberProfile(serverName,d.usuario?.sigla||registration||cached?.registration||'');
  state.cart=[];state.screen='select';
  await loadStock();
 }catch(e){state.error='Não foi possível '+(type==='login'?'entrar':'cadastrar')+': '+e.message}
 finally{state.busy=false;render()}
}

function addSelection(id){if(!stockReady()||!Number.isInteger(id)||id<0||id>=6)return;const i=state.cart.findIndex(x=>x.id===id);if(i>=0)state.cart.splice(i,1);else if(total()<3&&state.inventory[id]>0)state.cart.push({id,qty:1});state.error='';render()}
function changeQty(id,delta){if(state.busy||!stockReady())return;let i=state.cart.findIndex(x=>x.id===id);if(i<0)return;let n=state.cart[i].qty+delta;if(n<=0)state.cart.splice(i,1);else if(total()+delta<=3&&n<=state.inventory[id])state.cart[i].qty=n;if(total()===0)state.screen='select';render()}
async function placeOrder(){
 if(state.busy||state.maintenance||!state.online||total()<1||total()>3)return;
 state.busy=true;state.error='';render();
 try{
  await request(API.status,{token:null});
  if(state.maintenance)throw Error('Máquina em manutenção. Procure o responsável.');
  if(!state.token||!state.user)throw Error('Entre na sua conta antes de comprar.');
  const me=await request(API.me);
  if((me.usuario?.nome||me.nome)!==state.user.name)throw Error('A sessão mudou. Entre novamente na sua conta.');
  if(!await syncInventory())throw Error('É necessário atualizar o estoque antes de enviar o pedido.');
  if(state.cart.some(x=>x.qty>state.inventory[x.id]))throw Error('O estoque mudou. Volte e ajuste as quantidades do pedido.');
  const payload={usuario:state.user?.name||'',total_cookies:total()};
  for(let i=1;i<=6;i++)payload['q'+i]=state.cart.find(x=>x.id===i-1)?.qty||0;
  const d=await request(API.createOrder,{method:'POST',body:payload,timeout:20000});
  if(d.pedido_id==null)throw Error('O ESP32 não retornou o identificador do pedido');
  state.order={id:d.pedido_id,status:d.status||'recebido',delivered:0,requested:total(),confirmed_by_sensor:false};
  state.screen='progress';startPolling();
 }catch(e){state.error='Pedido não confirmado: '+e.message+' Verifique o status antes de tentar novamente.'}
 finally{state.busy=false;render()}
}
function startPolling(){
 stopPolling();
 let inFlight=false;
 const poll=async()=>{
  if(inFlight||state.screen!=='progress'||!state.order)return;
  inFlight=true;
  try{
   const d=await request(API.orderStatus);
   if(state.maintenance){
    if(Number(d.pedido_id)===Number(state.order.id)&&Number.isInteger(d.cookies_entregues)&&d.cookies_entregues>=0&&d.cookies_entregues<=state.order.requested)state.order.delivered=d.cookies_entregues;
    stopPolling();render();return;
   }
   if(Number(d.pedido_id)!==Number(state.order.id))throw Error('Pedido retornado não corresponde ao atual');
   if(!d.status)throw Error('Status ausente');
   const confirmed=d.status==='entregue'&&d.sensor==='ok cookie entregue'&&d.total_cookies===state.order.requested&&d.cookies_entregues===state.order.requested;
   state.order={...state.order,status:d.status,delivered:d.cookies_entregues||0,requested:d.total_cookies||total(),confirmed_by_sensor:confirmed};
   state.error='';
   if(confirmed){stopPolling();state.screen='success';await refreshStockSilent()}
   else if(['erro','cancelado','ocioso'].includes(d.status)){stopPolling();state.error='Entrega não concluída. Procure o responsável para conferir o pedido.'}
   else if(d.status==='entregue'){state.error='Aguardando confirmação do sensor de entrega.'}
  }catch(e){state.error='Sem atualização do ESP32: '+e.message}
  finally{inFlight=false;}
  render();
 };
 poll();state.poll=setInterval(poll,1400);
}
async function refreshStockSilent(){
 await syncInventory();
}

function stopPolling(){if(state.poll){clearInterval(state.poll);state.poll=null}}
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='loginForm')authenticate('login');if(e.target.id==='registerForm')authenticate('register')});
root.addEventListener('click',async e=>{
 const action=e.target.closest('[data-action]')?.dataset.action;
 if(action==='check-status')return ping();
 if(state.busy)return;
 const flavor=e.target.closest('[data-flavor]');if(flavor)return addSelection(Number(flavor.dataset.flavor));
 const q=e.target.closest('[data-qty]');if(q)return changeQty(Number(q.dataset.qty),Number(q.dataset.delta));
 if(!action)return;
 state.error='';
 switch(action){
  case 'login':case 'register':return;
  case 'refresh-stock':return loadStock();
  case 'register-screen':state.screen='register';break;
  case 'login-screen':state.screen='login';break;
  case 'to-confirm':if(total()>0&&stockReady())state.screen='confirm';break;
  case 'back-select':state.screen='select';return loadStock();
  case 'place-order':return placeOrder();
  case 'dismiss-order':stopPolling();
  case 'new-order':state.cart=[];state.order=null;state.screen='select';return loadStock();
  case 'logout':
   if(state.token)request('/api/auth/logout',{method:'POST',body:{}}).catch(()=>{});
   stopPolling();state.cart=[];state.order=null;state.token=null;state.user=null;state.screen='login';break;
 }
 render();
});
setInterval(()=>{if(!document.hidden&&!state.busy&&!state.maintenance&&['select','confirm'].includes(state.screen))loadStock();},STOCK_SYNC_MS);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){ping();if(!state.busy&&!state.maintenance&&['select','confirm'].includes(state.screen))loadStock();}});
render();ping();setInterval(ping,5000);
</script></body></html>
